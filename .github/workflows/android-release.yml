name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # matches package.json engines >= 22.11.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ── Keystore ────────────────────────────────────────────────────────────
      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_B64 }}" \
            | base64 -d > android/app/ping-release.keystore

      # ── Build ───────────────────────────────────────────────────────────────
      # -PreactNativeArchitectures limits to real-device ABIs only (no x86/x86_64
      # emulator slices), cutting build time roughly in half.
      # Per-ABI builds produce: app-arm64-v8a-release.apk + app-armeabi-v7a-release.apk
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ping-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      # ── Rename APKs ─────────────────────────────────────────────────────────
      # Gradle names per-ABI APKs "app-<abi>-release.apk"; rename each to
      # "Ping-<abi>.apk" so the GitHub Release attachment names are readable.
      # Also handles the edge case of a single universal "app-release.apk".
      - name: Rename APKs
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          for apk in "$APK_DIR"/app-*-release.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | sed 's/^app-//;s/-release\.apk$//')
            mv "$apk" "$APK_DIR/Ping-${abi}.apk"
          done
          # universal APK fallback
          if [ -f "$APK_DIR/app-release.apk" ]; then
            mv "$APK_DIR/app-release.apk" "$APK_DIR/Ping.apk"
          fi

      # ── Tag ─────────────────────────────────────────────────────────────────
      - name: Generate release tag
        id: release
        run: echo "tag=v$(date +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Ping ${{ steps.release.outputs.tag }}
          body: |
            ## Ping Android Build

            Latest development build of Ping.

            Commit: `${{ github.sha }}`
          files: android/app/build/outputs/apk/release/Ping*.apk
          generate_release_notes: true