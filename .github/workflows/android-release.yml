name: Build Android APK – Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Prod Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ── Keystore ────────────────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" \
            | base64 -d > android/app/ping-release.keystore

      # ── Verify keystore BEFORE expensive Gradle build ───────────────────────
      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list \
            -v \
            -keystore android/app/ping-release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "Alias name:|Entry type:"

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build Prod release APK
        env:
          RELEASE_STORE_FILE: ping-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleProdRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      # ── Rename APKs ─────────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          APK_DIR=android/app/build/outputs/apk/prod/release

          # Multi-ABI split APKs (arm64-v8a, armeabi-v7a)
          for apk in "$APK_DIR"/app-prod-*-release.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | sed 's/^app-prod-//;s/-release\.apk$//')
            mv "$apk" "$APK_DIR/Ping-${abi}.apk"
          done

          # Universal / fat APK (no ABI split)
          if [ -f "$APK_DIR/app-prod-release.apk" ]; then
            mv "$APK_DIR/app-prod-release.apk" "$APK_DIR/Ping.apk"
          fi

      # ── Tag ─────────────────────────────────────────────────────────────────
      - name: Generate release tag
        id: release
        run: |
          echo "tag=v$(date +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Ping ${{ steps.release.outputs.tag }}
          body: |
            ## Ping Android Build

            Production release of Ping.

            Commit: `${{ github.sha }}`
          files: |
            android/app/build/outputs/apk/prod/release/Ping*.apk
          generate_release_notes: true